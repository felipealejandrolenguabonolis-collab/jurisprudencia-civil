# Guardar en: .github/workflows/jurisprudencia-diaria.yml
name: Jurisprudencia civil diaria

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 7:00 a. m. hora Colombia
  workflow_dispatch:        # permite correrlo a mano
  push:                     # corre solo al guardar este archivo (primera prueba)
    paths:
      - ".github/workflows/jurisprudencia-diaria.yml"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser
      - run: python jurisprudencia_civil.py
      - name: Guardar cola de aprobación
        run: |
          git config user.name "bot-jurisprudencia"
          git config user.email "bot@users.noreply.github.com"
          git add estado.json || true
          git diff --staged --quiet || (git commit -m "Novedades pendientes de aprobar $(date -u +%F)" && git push)
